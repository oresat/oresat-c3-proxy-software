[project]
name = "oresat-c3-proxy"
version = "0.1.0"
description = "Graphical interface for the c3-proxy infrastructure and testing board of the OreSat project"
readme = "README.md"
authors = [{ name = "Elliott Day", email = "ellda@pdx.edu"}]

#TODO: idk what reasonable versions are here
requires-python = ">=3.12.3"
dependencies = [
    "pyside6",
    "numpy",
    "smbus2",
    "gpiod",
    "pyqtgraph",
    "pandas"
]

[project.scripts]
oresat-c3-proxy = "oresat_c3_proxy.__main__:main"


